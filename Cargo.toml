[package]
name = "kvs"
description = "a key-value store"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kvs"

[dependencies]
clap = { version = "4.5", features = ["cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
thiserror = "2"


[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
walkdir = "2.5"
